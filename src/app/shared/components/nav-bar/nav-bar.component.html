<a class="skip-link" href="#main-content">Saltar al contenido</a>

<aside class="nav-rail" [class.is-collapsed]="collapsed">
  <div class="rail-controls">
    <button
      type="button"
      class="collapse-button"
      [attr.aria-label]="collapsed ? 'Expandir menú' : 'Contraer menú'"
      [attr.aria-expanded]="!collapsed"
      [attr.title]="collapsed ? 'Expandir menú' : 'Contraer menú'"
      (click)="toggleCollapsed()">
      <span class="collapse-chevron" aria-hidden="true"></span>
    </button>
  </div>

  <nav class="primary-nav" aria-label="Navegación principal">
    <a
      routerLink="/dashboard"
      class="nav-destination"
      title="Resumen"
      [class.is-active]="activeSection === 'dashboard'"
      [attr.aria-current]="activeSection === 'dashboard' ? 'page' : null">
      <mat-icon svgIcon="home"></mat-icon>
      <span>Resumen</span>
    </a>
    <a
      routerLink="/schedule"
      class="nav-destination"
      title="Agenda"
      [class.is-active]="activeSection === 'schedule'"
      [attr.aria-current]="activeSection === 'schedule' ? 'page' : null">
      <mat-icon svgIcon="agenda"></mat-icon>
      <span>Agenda</span>
    </a>
    <a
      routerLink="/patient-list"
      class="nav-destination"
      title="Pacientes"
      [class.is-active]="activeSection === 'patients'"
      [attr.aria-current]="activeSection === 'patients' ? 'page' : null">
      <mat-icon svgIcon="pacientes"></mat-icon>
      <span>Pacientes</span>
    </a>
  </nav>

  <nav class="rail-utilities" aria-label="Utilidades">
    <a
      routerLink="/settings"
      class="nav-destination"
      title="Configuración"
      [class.is-active]="activeSection === 'settings'"
      [attr.aria-current]="activeSection === 'settings' ? 'page' : null">
      <mat-icon svgIcon="settings"></mat-icon>
      <span>Configuración</span>
    </a>
  </nav>
</aside>

<header class="topbar">
  <a class="topbar-brand" routerLink="/dashboard" aria-label="Ir al inicio de Odontofy">
    <img class="topbar-brand__icon" src="/icons/iconsV3/tooth.svg" alt="" aria-hidden="true">
    <span class="topbar-brand__wordmark" aria-hidden="true">
      <span class="topbar-brand__primary">ODONT</span><span class="topbar-brand__secondary">OFY</span>
    </span>
  </a>

  <button
    type="button"
    class="account-button"
    [matMenuTriggerFor]="accountMenu"
    aria-label="Abrir menú de cuenta">
    <span class="account-avatar" aria-hidden="true">{{ userInitials }}</span>
    <span class="account-name">{{ userName }}</span>
    <span class="account-chevron" aria-hidden="true"></span>
  </button>
</header>

<mat-menu #accountMenu="matMenu" xPosition="before">
  <!-- <a mat-menu-item routerLink="/settings">
    <mat-icon svgIcon="settings"></mat-icon>
    <span>Configuración</span>
  </a> -->
  <button mat-menu-item type="button" (click)="doLogout()">
    <mat-icon svgIcon="logout"></mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>

<nav class="mobile-nav" aria-label="Navegación principal móvil">
  <a routerLink="/dashboard" [class.is-active]="activeSection === 'dashboard'" [attr.aria-current]="activeSection === 'dashboard' ? 'page' : null">
    <mat-icon svgIcon="home"></mat-icon>
    <span>Resumen</span>
  </a>
  <a routerLink="/schedule" [class.is-active]="activeSection === 'schedule'" [attr.aria-current]="activeSection === 'schedule' ? 'page' : null">
    <mat-icon svgIcon="agenda"></mat-icon>
    <span>Agenda</span>
  </a>
  <a routerLink="/patient-list" [class.is-active]="activeSection === 'patients'" [attr.aria-current]="activeSection === 'patients' ? 'page' : null">
    <mat-icon svgIcon="pacientes"></mat-icon>
    <span>Pacientes</span>
  </a>
  <a routerLink="/settings" [class.is-active]="activeSection === 'settings'" [attr.aria-current]="activeSection === 'settings' ? 'page' : null">
    <mat-icon svgIcon="settings"></mat-icon>
    <span>Configuración</span>
  </a>
</nav>
