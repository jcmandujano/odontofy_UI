<app-nav-bar></app-nav-bar>
<ngx-spinner type="ball-newton-cradle"></ngx-spinner>

<div class="container">
  <div class="row navigation_row">
    <div class="col-12">
      <span class="pacientes_navigation">Inicio > Agenda</span>
    </div>
  </div>
  <div class="row pacientes_header_row">
    <div class="col-6">
      <div class="title_container">
        <mat-icon svgIcon="agenda" class="dashboard_agenda_icon"></mat-icon>
        <span class="pacientes_title">Agenda</span>
      </div>
    </div>
    <div class="col-6">
      <div class="nuevo_paciente_button_container">
        @if (!isUserSyncGoogle) {
        <button mat-stroked-button color="primary" class="google-connect-btn" (click)="syncGoogle()">
          <img src="icons/google-calendar.png" alt="Logotipo de Google" />
          Conectar
        </button>
        }
        <!--               <button mat-stroked-button color="primary" class="google-connect-btn" (click)="syncGoogle()" *ngIf="!isUserSyncGoogle">
                <img src="icons/google-calendar.png" alt="Logotipo de Google" />
                Conectar
              </button> -->

        <button mat-fab extended class="logout-navbar-button mat-elevation-z0" (click)="newAppointment()">Agregar
          cita</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12 agenda-container">
      <div class="row text-center">
        <div class="col-md-4">
          <div class="btn-group">
            <div class="btn btn-primary" mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate"
              (viewDateChange)="onViewDateChange($event)">
              Anterior
            </div>
            <div class="btn btn-outline-secondary" mwlCalendarToday [(viewDate)]="viewDate"
              (viewDateChange)="onViewDateChange($event)">
              Actual
            </div>
            <div class="btn btn-primary" mwlCalendarNextView [view]="view" [(viewDate)]="viewDate"
              (viewDateChange)="onViewDateChange($event)">
              Siguiente
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <h3>
            {{ viewDate | calendarDate:(view + 'ViewTitle'):locale:weekStartsOn }}
          </h3>
        </div>
        <div class="col-md-4">
          <div class="btn-group">
            <div class="btn btn-primary" (click)="setView(CalendarView.Month)"
              [class.active]="view === CalendarView.Month">
              Mes
            </div>
            <div class="btn btn-primary" (click)="setView(CalendarView.Week)"
              [class.active]="view === CalendarView.Week">
              Semana
            </div>
            <div class="btn btn-primary" (click)="setView(CalendarView.Day)" [class.active]="view === CalendarView.Day">
              Día
            </div>
          </div>
        </div>
      </div>
      <div>
        <ng-template #monthEventActions let-event="event">
          @if (event.id) {
            <div class="month-event-actions">
              <button
                type="button"
                mat-stroked-button
                class="month-event-action month-event-action--edit"
                matTooltip="Editar cita"
                aria-label="Editar cita"
                (click)="$event.stopPropagation(); handleEditEvent(event)">
                <mat-icon svgIcon="editaCita"></mat-icon>
                <span>Editar</span>
              </button>
              <button
                type="button"
                mat-stroked-button
                class="month-event-action month-event-action--delete"
                matTooltip="Eliminar cita"
                aria-label="Eliminar cita"
                (click)="$event.stopPropagation(); handleDeleteEvent(event)">
                <mat-icon svgIcon="eliminaCita"></mat-icon>
                <span>Eliminar</span>
              </button>
            </div>
          }
        </ng-template>

        <ng-template #timedEventActions let-event="event">
          @if (event.id) {
            <div class="timed-event-actions">
              <button
                type="button"
                mat-icon-button
                class="timed-event-action timed-event-action--edit"
                matTooltip="Editar cita"
                aria-label="Editar cita"
                (click)="$event.stopPropagation(); handleEditEvent(event)">
                <mat-icon svgIcon="editaCita"></mat-icon>
              </button>
              <button
                type="button"
                mat-icon-button
                class="timed-event-action timed-event-action--delete"
                matTooltip="Eliminar cita"
                aria-label="Eliminar cita"
                (click)="$event.stopPropagation(); handleDeleteEvent(event)">
                <mat-icon svgIcon="eliminaCita"></mat-icon>
              </button>
            </div>
          }
        </ng-template>

        @switch (view) {
        @case ("month") {
        <mwl-calendar-month-view [viewDate]="viewDate" [events]="events" [locale]="locale" [refresh]="refresh"
          [activeDayIsOpen]="activeDayIsOpen" [eventActionsTemplate]="monthEventActions"
          (dayClicked)="dayClicked($event.day)">
        </mwl-calendar-month-view>
        }
        @case ("week") {
        <mwl-calendar-week-view [viewDate]="viewDate" [events]="events" [locale]="locale" [refresh]="refresh"
          [eventActionsTemplate]="timedEventActions">
        </mwl-calendar-week-view>
        }
        @case ("day") {
        <mwl-calendar-day-view [viewDate]="viewDate" [events]="events" [locale]="locale" [refresh]="refresh"
          [eventActionsTemplate]="timedEventActions">
        </mwl-calendar-day-view>
        }
        }
      </div>
    </div>
  </div>
</div>
