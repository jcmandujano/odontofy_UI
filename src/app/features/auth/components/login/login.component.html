<ngx-spinner type="ball-newton-cradle"></ngx-spinner>
<main>
  <section class="login_row">
    <section class="login_form_column">
      <section class="login_form_logo">
        <button type="button" class="logo-button" (click)="gotoHome()" aria-label="Ir al inicio">
          <img src="/img/logo.png" alt="Odontofy">
        </button>
      </section>
      <div class="login_form_container center_container">
        <form [formGroup]="loginForm" (ngSubmit)="doLogin()">
          <div class="login_form_container_welcome">
            <h1 class="login_form_title">Bienvenido</h1>
            <p class="subtitle">Ingresa tus datos de acceso.</p>
          </div>
          <div class="login_form_container_form">
            <mat-form-field class="login_form_control" appearance="outline">
              <mat-icon class="prefix_form_color" matPrefix> mail</mat-icon>
              <mat-label>Correo electrónico</mat-label>
              <input type="email" matInput formControlName="username" autocomplete="email">
            </mat-form-field>
            <br>
            <mat-form-field class="login_form_control" appearance="outline">
              <mat-icon class="prefix_form_color" matPrefix> keyboard</mat-icon>
              <mat-label>Contraseña</mat-label>
              <button type="button" class="login_form_pass_toggle" mat-icon-button matSuffix (click)="hide = !hide" aria-label="Mostrar u ocultar contraseña">
                <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <input matInput formControlName="password" [type]="hide ? 'password' : 'text'" autocomplete="current-password">
            </mat-form-field>
            <br>
          </div>
          <div class="login_form_container_actions">
            <button type="submit" class="button button--confirm">Iniciar sesión</button>
            <p class="options_text" routerLink="/forgot-password">Recuperar mi contraseña</p>
            <p class="options_text" routerLink="/register">Regístrate</p>
          </div>
          <div class="login_form_containe_legal">
            <div class="row">
              <div class="col-6">
                <p class="legal_text" (click)="openTermsConditionsDialog()">Términos y condiciones</p>
              </div>
              <div class="col-6">
                <p class="legal_text" (click)="openPrivacyTermsDialog()">Aviso de privacidad</p>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>
    <section class="extra_info_column">
    </section>
  </section>
</main>
