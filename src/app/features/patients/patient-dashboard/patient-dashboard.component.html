<main class="container patient-dashboard">
  <header class="patient-dashboard-intro">
    <h1>Resumen del expediente</h1>
    <p>Consulta la información clínica y administrativa del paciente.</p>
  </header>

  <nav class="menu_grid" aria-label="Secciones del expediente">
    <button type="button" class="custom_card_header dashboard-menu-card" (click)="goToExpediente()">
      <span class="custom_icon">
        <mat-icon svgIcon="patientDashboardFile" class="dashboard_agenda_icon"></mat-icon>
      </span>
      <span class="custom_title">
        <span class="custom_card_title">Ficha de identificación</span>
        <span class="custom-card-subtitle">Consulta y modifica los datos</span>
      </span>
    </button>

    <button type="button" class="custom_card_header dashboard-menu-card" (click)="goToConsentimientos()">
      <span class="custom_icon">
        <mat-icon svgIcon="patientDashboardConsents" class="dashboard_agenda_icon"></mat-icon>
      </span>
      <span class="custom_title">
        <span class="custom_card_title">Consentimientos</span>
        <span class="custom-card-subtitle">Imprime y almacena consentimientos personalizados</span>
      </span>
    </button>

    <button type="button" class="custom_card_header dashboard-menu-card" (click)="goToNotasEvolucion()">
      <span class="custom_icon">
        <mat-icon svgIcon="patientDashboardNotes" class="dashboard_agenda_icon"></mat-icon>
      </span>
      <span class="custom_title">
        <span class="custom_card_title">Notas de evolución</span>
        <span class="custom-card-subtitle">Agrega una nueva o revisa el historial</span>
      </span>
    </button>

    <button type="button" class="custom_card_header dashboard-menu-card" (click)="goToTreatmentPlans()">
      <span class="custom_icon">
        <mat-icon svgIcon="patientDashboardTreatmentPlan" class="dashboard_agenda_icon"></mat-icon>
      </span>
      <span class="custom_title">
        <span class="custom_card_title">Planes de tratamiento</span>
        <span class="custom-card-subtitle">Consulta las propuestas clínicas y económicas del paciente</span>
      </span>
    </button>

    <button type="button" class="custom_card_header dashboard-menu-card" (click)="goToHistorialPagos()">
      <span class="custom_icon">
        <mat-icon svgIcon="patientDashboardPayments" class="dashboard_agenda_icon"></mat-icon>
      </span>
      <span class="custom_title">
        <span class="custom_card_title">Historial de pagos</span>
        <span class="custom-card-subtitle">Resumen de pagos del paciente</span>
      </span>
    </button>

    @if (showPatientOdontogram) {
      <button type="button" class="custom_card_header dashboard-menu-card" (click)="goToOdontograma()">
        <span class="custom_icon">
          <mat-icon svgIcon="patientDashboardOdontogram" class="dashboard_agenda_icon"></mat-icon>
        </span>
        <span class="custom_title">
          <span class="custom_card_title">Odontograma</span>
          <span class="custom-card-subtitle">Consulta y modifica el odontograma de este paciente</span>
        </span>
      </button>
    }
  </nav>
</main>
