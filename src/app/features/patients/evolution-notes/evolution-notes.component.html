<ngx-spinner type="ball-newton-cradle"></ngx-spinner>

<div class="container">
  <div class="row pacientes_header_row">
    <div class="col-6">
      <div class="title_container">
        <mat-icon svgIcon="agenda" class="dashboard_agenda_icon"></mat-icon>
        <span class="pacientes_title">Notas de evolución</span>
      </div>
    </div>
    <div class="col-6">
      <div class="nuevo_paciente_button_container"> <button mat-fab extended class="logout-navbar-button app-primary-action"
      (click)="creaNotaDialog()">Agregar nota</button> </div>
    </div>
  </div>
  <div class="row filters_row">
    <div class="col-12 flex-container">
      <mat-form-field appearance="outline" class="actions_inputs bg-transparente">
        <mat-label>Buscar...</mat-label>
        <input matInput placeholder="" [(ngModel)]="searchCriteria" (keyup.enter)="onSearch()">
        @if (searchCriteria) {
          <button class="clearCriteria" matSuffix mat-icon-button aria-label="Limpiar búsqueda" (click)="clearCriteria()">
            <mat-icon svgIcon="close"></mat-icon>
          </button>
        }
      </mat-form-field>
      <!--  <button mat-icon-button color="primary" class="searchButtton" (click)="searchByCriteria(searchCriteria)">
      <mat-icon svgIcon="search"></mat-icon>
    </button> -->
  </div>
</div>
<div class="row">
  <div class="col-12">
    @if (dataSource && dataSource.length > 0) {
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z0 info-table">
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef class="signin-header-column"> Fecha </th>
          <td mat-cell *matCellDef="let element" class="signin-content-column"> {{element.createdAt | date }}
          </td>
        </ng-container>
        <ng-container matColumnDef="nota">
          <th mat-header-cell *matHeaderCellDef class="name-header-column"> Nota </th>
          <td mat-cell *matCellDef="let element" class="name-content-column"> {{limpiarHtml(element.note)}}
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="nextdate-header-column"> Acciones </th>
          <td mat-cell *matCellDef="let element" class="nextdate-content-column">
            <div class="dashboard_list_container">
              <div class="dashboard_list_actons">
                <button type="button" mat-icon-button aria-label="Editar nota" (click)="editarNotaDialog(element)">
                  <mat-icon svgIcon="editaCita"></mat-icon>
                </button>
                <button type="button" mat-icon-button aria-label="Eliminar nota" (click)="eliminarNota(element.id)">
                  <mat-icon svgIcon="eliminaCita"></mat-icon>
                </button>
              </div>
            </div>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;">
        </tr>
      </table>
    }
    @if (!dataSource || dataSource.length === 0) {
      <app-no-data-found [title]="'Este paciente no tiene notas de evolución'"
        [message]="'Haz clic en el botón «Agregar nota» para registrar la primera.'">
      </app-no-data-found>
    }
  </div>
</div>
<div class="row">
  <div class="col-12">
    @if (dataSource && dataSource.length > 0) {
      <mat-paginator (page)="handlePageEvent($event)" [length]="length" [pageSize]="pageSize"
        [pageIndex]="pageIndex" [pageSizeOptions]="[10, 25, 50, 100]" class="custom-paginator">
      </mat-paginator>
    }
  </div>
</div>
</div>
